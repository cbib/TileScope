# Python CI for TileScope.
# Runs pytest against the declared pip requirements so latent bugs like
# task #16 (matplotlib.cm.get_cmap removed in 3.9, undetected because there
# was no Python CI) and task #39 (statsmodels not declared, silently
# falling back to a manual BH implementation) cannot recur.

on:
  push:
    branches: [main, master, code-revision-debugging]
  pull_request:

name: python-tests.yaml

permissions: read-all

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # pdf2image needs poppler at runtime.
      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install tilescope + test extras
        run: python -m pip install -e "python[test]"

      # Fixture paths resolve via the installed package (task #18), so pytest
      # can run from anywhere. No working-directory hack needed.
      - name: Run unit + integration tests
        run: |
          python -m pytest python/tilescope/tests \
            --ignore=python/tilescope/tests/e2e \
            --ignore=python/tilescope/tests/scenarios \
            -q --tb=short
