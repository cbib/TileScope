[pytest]
# Pytest configuration for TileScope

# Test discovery paths
testpaths = tests

# Custom markers for selective test execution
markers =
    slow: Slow tests - full-pipeline loops over fixtures, ensemble repeats, stability tests (>5s per test)
    visual: Visual tests - generate images/PDFs (deselect for headless CI environments)
    e2e: End-to-end tests - full system validation across all components
